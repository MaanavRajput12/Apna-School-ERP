services:
  postgres:
    image: postgres:17
    container_name: cerp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collegedb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-collegedb}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./collegedb
    container_name: cerp-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-collegedb}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JPA_DDL_AUTO: update
      APP_CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-4000}
      ROOT_LOG_LEVEL: INFO
      APP_LOG_LEVEL: INFO
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./CERP_Interface
    container_name: cerp-frontend
    depends_on:
      - backend
    environment:
      PORT: 4000
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-4000}:4000"

volumes:
  postgres-data:
