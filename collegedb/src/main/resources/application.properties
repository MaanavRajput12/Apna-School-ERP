spring.application.name=CollegeDB
server.port=${SERVER_PORT:8080}

# Database connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/collegedb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Logging
logging.level.root=${ROOT_LOG_LEVEL:INFO}
logging.level.com.example.collegedb=${APP_LOG_LEVEL:INFO}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4000}
